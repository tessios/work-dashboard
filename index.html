<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F3F5FA">
<meta name="color-scheme" content="light dark">
<title>업무 대시보드</title>
<style>
  :root{
    --bg:#F3F5FA; --bg-tint1:#E9EEFC; --bg-tint2:#FBF3E8;
    --card:#FFFFFF; --card-2:#FAFBFD; --ink:#121826; --ink-2:#3C4657; --sub:#727D90;
    --line:#E4E8F0; --line-soft:#EEF1F6;
    --accent:#4A5FE0; --accent-2:#7B5CF0; --accent-soft:#EDF0FE;
    --action:#DC3B45; --action-soft:#FDECEE;
    --progress:#C9801A; --progress-soft:#FFF3E0;
    --done:#0C8F7B; --done-soft:#E5F6F2;
    --shadow-sm:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.045);
    --shadow-md:0 2px 6px rgba(16,24,40,.05), 0 14px 34px rgba(16,24,40,.08);
    --shadow-lg:0 24px 60px rgba(12,18,32,.20);
    --r:18px; --r-sm:12px;
  }
  html[data-theme="dark"]{
    --bg:#0D1017; --bg-tint1:#141A2E; --bg-tint2:#1A1610;
    --card:#161B25; --card-2:#1A2029; --ink:#EAEEF6; --ink-2:#C6CEDA; --sub:#939EB2;
    --line:#252C3A; --line-soft:#1E2532;
    --accent:#8A9BFF; --accent-2:#B49BFF; --accent-soft:#1C2340;
    --action:#FF7B84; --action-soft:#33191D;
    --progress:#F2B45A; --progress-soft:#2E2415;
    --done:#4AD3BC; --done-soft:#122923;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --shadow-md:0 2px 6px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; letter-spacing:-.01em;
    min-height:100vh;
    background-image:
      radial-gradient(1100px 520px at 8% -8%, var(--bg-tint1) 0%, transparent 62%),
      radial-gradient(900px 460px at 100% 0%, var(--bg-tint2) 0%, transparent 58%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
  input{font-family:inherit;color:inherit}
  h1,h2,h3,h4,p{margin:0}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 72px}

  /* ---------- header ---------- */
  .hd{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
  .hd-top{display:flex;align-items:center;gap:13px}
  .mark{
    width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 8px 20px rgba(74,95,224,.32);
  }
  .mark svg{width:23px;height:23px}
  .hd-t h1{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.2}
  .hd-t p{font-size:12.5px;color:var(--sub);margin-top:3px;font-weight:500}
  .hd-btns{margin-left:auto;display:flex;gap:7px}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    color:var(--ink-2);transition:.18s;
  }
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--line)}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hd-meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12px;color:var(--sub);font-weight:500;
  }
  .live{
    display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);color:var(--ink-2);
  }
  .live .dot{width:6px;height:6px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px var(--done-soft)}
  .live.offline .dot{background:var(--progress);box-shadow:0 0 0 3px var(--progress-soft)}
  .hd-meta b{color:var(--ink-2);font-weight:700}
  .meta-line{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta-line .sep{color:var(--line)}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat{
    position:relative;text-align:left;padding:14px 14px 13px;border-radius:var(--r);
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    transition:.18s;overflow:hidden;
  }
  .stat::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,var(--tint) 0%,transparent 62%);opacity:.55;
  }
  html[data-theme="dark"] .stat::after{opacity:.35}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .stat[aria-pressed="true"]{border-color:var(--tone);box-shadow:0 0 0 2px var(--tone-soft),var(--shadow-md)}
  .stat .s-l{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);position:relative;z-index:1}
  .stat .s-l i{width:7px;height:7px;border-radius:50%;background:var(--tone);display:inline-block}
  .stat .s-n{font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.1;margin-top:6px;color:var(--ink);position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .stat .s-n span{font-size:13px;font-weight:700;color:var(--sub);margin-left:2px;letter-spacing:0}
  .stat .s-s{font-size:11px;color:var(--sub);margin-top:4px;position:relative;z-index:1;line-height:1.4;display:none}
  .stat.action{--tone:var(--action);--tone-soft:var(--action-soft);--tint:var(--action-soft)}
  .stat.progress{--tone:var(--progress);--tone-soft:var(--progress-soft);--tint:var(--progress-soft)}
  .stat.done{--tone:var(--done);--tone-soft:var(--done-soft);--tint:var(--done-soft)}

  /* ---------- toolbar ---------- */
  .toolbar{position:sticky;top:0;z-index:20;padding:10px 0 12px;margin:0 0 6px;
    background:linear-gradient(180deg,var(--bg) 62%,transparent);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .search{position:relative;margin-bottom:10px}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sub)}
  .search input{
    width:100%;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--card);
    padding:0 40px 0 39px;font-size:14px;outline:none;box-shadow:var(--shadow-sm);transition:.16s;
  }
  .search input::placeholder{color:var(--sub)}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;display:none;place-items:center;color:var(--sub);font-size:15px}
  .search.has-value .clear{display:grid}
  .seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow-sm);overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{
    flex:1 1 auto;white-space:nowrap;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub);transition:.16s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .seg button .c{font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--line-soft);color:var(--sub);font-variant-numeric:tabular-nums}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
  .seg button[aria-pressed="true"] .c{background:rgba(255,255,255,.2);color:inherit}
  html[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--accent);color:#0D1017}
  .chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;flex:none;padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--card);border:1px solid var(--line);color:var(--sub);transition:.16s;box-shadow:var(--shadow-sm);
  }
  .chip:hover{color:var(--ink-2);border-color:var(--sub)}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);box-shadow:none}
  html[data-theme="dark"] .chip[aria-pressed="true"]{color:var(--accent)}

  /* ---------- list ---------- */
  main{display:flex;flex-direction:column;gap:24px;margin-top:12px}
  .group{display:flex;flex-direction:column;gap:10px}
  .g-hd{display:flex;align-items:center;gap:9px;padding:0 2px 2px}
  .g-hd .gi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;flex:none}
  .g-hd h2{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .g-hd .gc{font-size:11.5px;font-weight:800;color:var(--sub);background:var(--line-soft);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .g-hd .gh-hint{font-size:11.5px;color:var(--sub);font-weight:500;margin-left:auto;text-align:right}
  .group.action .gi{background:var(--action-soft);color:var(--action)}
  .group.progress .gi{background:var(--progress-soft);color:var(--progress)}
  .group.done .gi{background:var(--done-soft);color:var(--done)}
  .cards{display:grid;grid-template-columns:1fr;gap:9px}
  .date-hd{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:0;margin:8px 2px 0}
  .date-hd:first-child{margin-top:0}
  .date-hd::after{content:"";flex:1;height:1px;background:var(--line)}
  .date-hd .dc{font-size:10.5px;font-weight:800;background:var(--done-soft);color:var(--done);padding:1px 7px;border-radius:999px}

  .card{
    position:relative;text-align:left;padding:14px 15px 13px;border-radius:var(--r);width:100%;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    transition:transform .16s, box-shadow .16s, border-color .16s;overflow:hidden;
    display:flex;flex-direction:column;gap:7px;
  }
  .card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--tone);opacity:.85}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .group.action .card{--tone:var(--action)}
  .group.progress .card{--tone:var(--progress)}
  .group.done .card{--tone:var(--done)}
  .card .c-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line-soft);color:var(--ink-2);letter-spacing:0}
  .badge.cat{background:var(--accent-soft);color:var(--accent)}
  html[data-theme="dark"] .badge.cat{color:var(--accent)}
  .badge[data-cat="content"]{background:var(--accent-soft);color:var(--accent)}
  .badge[data-cat="work"]{background:#EAF0FF;color:#3C58C8}
  .badge[data-cat="review"]{background:#FBEEE0;color:#A9661A}
  .badge[data-cat="life"]{background:var(--done-soft);color:var(--done)}
  html[data-theme="dark"] .badge[data-cat="work"]{background:#1B2440;color:#9DB2FF}
  html[data-theme="dark"] .badge[data-cat="review"]{background:#2C2216;color:#E7AD6A}
  html[data-theme="dark"] .badge[data-cat="life"]{color:var(--done)}
  .due{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--sub);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
  .due.urgent{color:var(--action)}
  .due.soon{color:var(--progress)}
  .due.ok{color:var(--done)}
  .card h3{font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.4;color:var(--ink)}
  .card .c-sum{font-size:12.5px;color:var(--sub);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-next{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.45;
    padding-top:8px;border-top:1px dashed var(--line)}
  .card .c-next .arw{color:var(--tone);font-weight:900;flex:none}
  .card .c-next .t{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .group.done .card{background:var(--card-2)}
  .group.done .card h3{color:var(--ink-2);font-weight:600}
  .group.done .card .c-next{display:none}
  .group.done .card::before{opacity:.45}

  /* ---------- check · dismissed ---------- */
  .group.dismissed .gi{background:var(--line-soft);color:var(--sub)}
  .group.dismissed .g-hd h2{color:var(--ink-2)}
  .group.dismissed .card{background:var(--card-2);box-shadow:none}
  .group.dismissed .card::before{background:var(--sub);opacity:.3}
  .group.dismissed .card h3{color:var(--sub);font-weight:600;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--line)}
  .group.dismissed .card .c-sum{opacity:.7}
  .group.dismissed .card .c-next{display:none}
  .card{cursor:pointer}
  .badge.mine{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .card .c-acts{display:flex;gap:7px;padding-top:9px;margin-top:1px;border-top:1px dashed var(--line)}
  .qa{flex:1;height:34px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:-.01em;
      display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:.15s;
      border:1px solid var(--line);background:var(--card-2);color:var(--ink-2)}
  .qa:hover{transform:translateY(-1px)}
  .qa:active{transform:scale(.97)}
  .qa.ok{background:var(--done-soft);color:var(--done);border-color:transparent}
  .qa.no{background:var(--card);color:var(--sub)}
  .qa.undo{background:var(--accent-soft);color:var(--accent);border-color:transparent}

  /* ---------- check bar ---------- */
  .checkbar{display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:10px 12px;
    border-radius:14px;background:var(--accent-soft);border:1px solid transparent}
  .checkbar[hidden]{display:none}
  .cb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .cb-t{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--accent)}
  .cb-n{font-size:10.5px;font-weight:800;background:var(--accent);color:#fff;border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .cb-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;
    font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .cb-list::-webkit-scrollbar{display:none}
  .cb-i b{color:var(--accent);font-weight:800}
  .cb-sep{color:var(--sub);opacity:.5}
  .cb-copy{height:32px;padding:0 13px;border-radius:9px;background:var(--accent);color:#fff;
    font-size:12px;font-weight:800;flex:none;transition:.15s}
  .cb-copy:hover{filter:brightness(1.06)}
  .cb-copy.done{background:var(--done)}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
    z-index:80;display:flex;align-items:center;gap:4px;max-width:calc(100% - 28px);
    background:var(--ink);color:var(--card);border-radius:14px;padding:10px 10px 10px 16px;
    box-shadow:var(--shadow-lg);font-size:12.5px;font-weight:700;letter-spacing:-.01em;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{font-size:12.5px;font-weight:800;color:#B9C2FF;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.12);flex:none}
  html[data-theme="dark"] .toast{background:#EAEEF6;color:#0D1017}
  html[data-theme="dark"] .toast button{color:#3B4FD0;background:rgba(0,0,0,.07)}

  .empty{padding:56px 18px;text-align:center;color:var(--sub);font-size:13.5px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
  .empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:5px}

  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:11.5px;color:var(--sub);line-height:1.6}
  footer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--line-soft);padding:1px 5px;border-radius:5px}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,14,24,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow-lg);transform:translateY(102%);
    visibility:hidden;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .22s, visibility .28s;
  }
  .sheet.on{transform:translateY(0);visibility:visible;pointer-events:auto}
  .sh-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px}
  .sh-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .status-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:0}
  .status-pill.action{background:var(--action-soft);color:var(--action)}
  .status-pill.progress{background:var(--progress-soft);color:var(--progress)}
  .status-pill.done{background:var(--done-soft);color:var(--done)}
  .status-pill.dismissed{background:var(--line-soft);color:var(--sub)}
  .sh-x{margin-left:auto;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--sub);background:var(--line-soft);font-size:14px}
  .sheet h2{font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin-bottom:14px}
  .sh-facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
  .sh-fact{background:var(--card-2);border:1px solid var(--line-soft);border-radius:12px;padding:9px 11px}
  .sh-fact .k{font-size:10.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin-bottom:2px}
  .sh-fact .v{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.35}
  .sh-sec{margin-bottom:16px}
  .sh-sec h4{font-size:11.5px;font-weight:800;color:var(--sub);letter-spacing:.02em;margin-bottom:6px}
  .sh-sec p{font-size:13.5px;line-height:1.65;color:var(--ink-2);white-space:pre-wrap;word-break:keep-all}
  .sh-next{background:var(--accent-soft);border:1px solid transparent;border-radius:14px;padding:13px 14px;display:flex;align-items:flex-start;gap:10px}
  .sh-next p{font-size:13.5px;font-weight:700;color:var(--ink);flex:1}
  .sh-next .cp{font-size:11.5px;font-weight:800;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;flex:none;transition:.16s}
  .sh-next .cp:hover{transform:translateY(-1px)}
  .sh-done-next{font-size:13px;color:var(--sub);background:var(--card-2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
  .sh-acts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .sh-acts .qa{height:44px;font-size:13px}
  .sh-act-note{font-size:12px;color:var(--sub);font-weight:600;line-height:1.5;padding:10px 0}
  .sh-nav{display:flex;gap:8px;margin-top:4px}
  .sh-nav button{flex:1;height:42px;border-radius:12px;background:var(--card-2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);transition:.16s}
  .sh-nav button:disabled{opacity:.4;cursor:default}
  .sh-nav button:not(:disabled):hover{border-color:var(--sub)}

  @media (min-width:640px){
    .wrap{padding:34px 30px 90px}
    .hd-top{gap:15px}
    .hd-t h1{font-size:25px}
    .hd-t p{font-size:13px}

<script>
(function(){
  "use strict";

  var STATUS = {
    action:  {label:"액션 필요", pill:"액션 필요", icon:"!", hint:"직접 결정·발행·전달이 필요한 일"},
    progress:{label:"하는 중",   pill:"하는 중",   icon:"…", hint:"응답·승인·예약일을 기다리는 일"},
    done:    {label:"완료",      pill:"완료",      icon:"✓", hint:"최근 완료한 주요 성과"},
    dismissed:{label:"필요 없음", pill:"필요 없음", icon:"✕", hint:"내가 필요 없다고 표시한 일 · 되돌리기 가능"}
  };
  var ORDER = ["action","progress","done","dismissed"];
  var CATS = [
    {key:"all",     label:"전체"},
    {key:"content", label:"블로그·콘텐츠"},
    {key:"work",    label:"업무·자격증"},
    {key:"review",  label:"체험단·리뷰"},
    {key:"life",    label:"생활·금융"}
  ];
  var CAT_LABEL = CATS.reduce(function(m,c){ m[c.key]=c.label; return m; }, {});

  var state = {status:"all", cat:"all", q:"", openId:null, view:[]};
  var DATA = {meta:{}, items:[]};
  var RAW = [];

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $("list"), segEl = $("seg"), chipsEl = $("chips"),
      qEl = $("q"), searchWrap = $("search-wrap"),
      sheet = $("sheet"), scrim = $("scrim");

  /* ---------- utils ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function parseDay(s){
    if(!s) return null;
    var p = String(s).slice(0,10).split("-");
    return new Date(+p[0], (+p[1])-1, +p[2]);
  }
  function startOfToday(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function dayDiff(dueStr){
    var d = parseDay(dueStr);
    if(!d) return null;
    return Math.round((d - startOfToday())/86400000);
  }
  function fmtMD(s){
    var d = parseDay(s);
    if(!d) return "";
    return (d.getMonth()+1) + "/" + pad(d.getDate());
  }
  function fmtFull(s){
    var d = parseDay(s);
    if(!d) return "—";
    var w = ["일","월","화","수","목","금","토"][d.getDay()];
    return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + w + ")";
  }
  function dueInfo(item){
    if(item.status === "done"){
      if(!item.done_at) return null;
      return {text: fmtMD(item.done_at) + " 완료", cls:"done"};
    }
    var n = dayDiff(item.due);
    if(n === null) return null;
    if(n < 0)  return {text: Math.abs(n) + "일 지남", cls:"urgent"};
    if(n === 0) return {text:"오늘 마감", cls:"urgent"};
    if(n === 1) return {text:"내일 마감", cls:"urgent"};
    if(n <= 3)  return {text:"D-" + n, cls:"soon"};
    if(n <= 10) return {text:"D-" + n, cls:"soon"};
    return {text: fmtMD(item.due), cls:""};
  }
  function dueSort(item){
    var n = dayDiff(item.due);
    return n === null ? 9999 : n;
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function norm(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").trim(); }

  /* ---------- theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("wd-theme", t); }catch(e){}
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#0D1017" : "#F3F5FA");
  }
  (function initTheme(){
    var t = "light";
    try{
      var saved = localStorage.getItem("wd-theme");
      if(saved) t = saved;
      else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    }catch(e){}
    applyTheme(t);
  })();
  $("theme-btn").addEventListener("click", function(){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ---------- today label ---------- */
  (function(){
    var d = new Date(), w = ["일","월","화","수","목","금","토"][d.getDay()];
    $("date-label").textContent = d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + w + ")";
  })();

  /* ---------- data load ---------- */
  function setLive(kind, text){
    var pill = $("live-pill");
    pill.classList.toggle("offline", kind === "offline");
    $("live-text").textContent = text;
  }
  function ageText(iso){
    if(!iso) return "업데이트 시각 없음";
    var t = new Date(iso).getTime();
    if(isNaN(t)) return "업데이트 시각 확인 불가";
    var diff = Math.max(0, Date.now() - t);
    var m = Math.floor(diff/60000);
    if(m < 1) return "방금";
    if(m < 60) return m + "분 전";
    var h = Math.floor(m/60);
    if(h < 24) return h + "시간 전";
    var d = Math.floor(h/24);
    if(d < 8) return d + "일 전";
    return "오래된 데이터";
  }
  function readFallback(){
    try{ return JSON.parse($("fallback-data").textContent); }catch(e){ return {meta:{}, items:[]}; }
  }
  function applyData(obj, offline){
    DATA = obj && obj.items ? obj : {meta:{}, items:[]};
    RAW = DATA.items.map(function(it, i){
      return Object.assign({id:"item-" + i}, it);
    });
    pruneOV();
    materialize();
    var meta = DATA.meta || {};
    $("upd-label").textContent = meta.updated_label || fmtMD(meta.updated_at) || "—";
    $("upd-age").textContent = ageText(meta.updated_at);
    $("ver-label").textContent = meta.version ? ("v" + meta.version) : "";
    setLive(offline ? "offline" : "on", offline ? "오프라인 데이터" : "최신 데이터 연결됨");
    renderAll();
  }
  function load(manual){
    var btn = $("refresh-btn");
    if(manual) btn.classList.add("spin");
    var done = function(){
      if(manual) setTimeout(function(){ btn.classList.remove("spin"); }, 450);
    };
    fetch("./tasks.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ applyData(j, false); done(); })
      .catch(function(){
        if(!DATA.items.length){
          applyData(readFallback(), true);
        }else{
          setLive("offline", "연결 실패 · 마지막 데이터");
          $("upd-age").textContent = "새로고침 실패";
        }
        done();
      });
  }

  /* ---------- filters ---------- */
  function counts(){
    var c = {action:0, progress:0, done:0, dismissed:0};
    DATA.items.forEach(function(it){ if(c[it.status] !== undefined) c[it.status]++; });
    return c;
  }
  function visibleItems(){
    var q = norm(state.q);
    return DATA.items.filter(function(it){
      if(state.status !== "all" && it.status !== state.status) return false;
      if(state.cat !== "all" && it.category !== state.cat) return false;
      if(q){
        var hay = norm([it.title, it.summary, it.memo, it.next, it.area, it.category].join(" "));
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }
  function sortGroup(items, status){
    return items.slice().sort(function(a,b){
      if(status === "done"){
        return String(b.done_at||"").localeCompare(String(a.done_at||""));
      }
      if(status === "dismissed"){
        return String((b._override&&b._override.at)||"").localeCompare(String((a._override&&a._override.at)||""));
      }
      var da = dueSort(a), db = dueSort(b);
      if(da !== db) return da - db;
      return (a.priority||9) - (b.priority||9);
    });
  }

  /* ---------- render ---------- */
  function renderStats(){
    var c = counts();
    ["action","progress","done"].forEach(function(k){
      var el = document.querySelector('[data-n="' + k + '"]');
      if(el) el.innerHTML = c[k] + "<span>건</span>";
    });
    document.querySelectorAll(".stat").forEach(function(b){
      b.setAttribute("aria-pressed", String(state.status === b.dataset.status));
    });
  }
  function renderSeg(){
    var c = counts();
    var tabs = [{key:"all", label:"전체", n: DATA.items.length}].concat(
      ORDER.map(function(k){ return {key:k, label:STATUS[k].label, n:c[k]}; })
    );
    segEl.innerHTML = tabs.map(function(t){
      return '<button type="button" data-status="' + t.key + '" aria-pressed="' + (state.status===t.key) + '">'
        + esc(t.label) + '<span class="c">' + t.n + '</span></button>';
    }).join("");
  }
  function renderChips(){
    var all = DATA.items;
    chipsEl.innerHTML = CATS.map(function(c){
      var n = c.key === "all" ? all.length : all.filter(function(it){ return it.category === c.key; }).length;
      return '<button class="chip" type="button" data-cat="' + c.key + '" aria-pressed="' + (state.cat===c.key) + '">'
        + esc(c.label) + (c.key === "all" ? "" : ' <span style="opacity:.6;font-weight:700">' + n + '</span>') + '</button>';
    }).join("");
  }
  function cardHTML(it){
    var di = (it.status === "done" || it.status === "dismissed") ? null : dueInfo(it);
    var dueHTML = di ? '<span class="due ' + di.cls + '">' + esc(di.text) + '</span>' : "";
    var nextHTML = it.next
      ? '<div class="c-next"><span class="arw">→</span><span class="t">' + esc(it.next) + '</span></div>'
      : "";
    var mineHTML = it._override ? '<span class="badge mine">내 체크</span>' : "";
    var acts = "";
    if(it.status === "action" || it.status === "progress"){
      acts = '<div class="c-acts">'
        + '<button class="qa ok" type="button" data-act="done" data-id="' + esc(it.id) + '">✅ 완료</button>'
        + '<button class="qa no" type="button" data-act="dismiss" data-id="' + esc(it.id) + '">🚫 필요 없음</button>'
        + '</div>';
    }else if(it._override){
      acts = '<div class="c-acts">'
        + '<button class="qa undo" type="button" data-act="undo" data-id="' + esc(it.id) + '">↩️ 되돌리기</button>'
        + '</div>';
    }
    return '<div class="card" role="button" tabindex="0" data-id="' + esc(it.id) + '">'
      + '<div class="c-top">'
      +   '<span class="badge" data-cat="' + esc(it.category || "") + '">' + esc(it.area || "") + '</span>'
      +   mineHTML
      +   dueHTML
      + '</div>'
      + '<h3>' + esc(it.title) + '</h3>'
      + '<p class="c-sum">' + esc(it.summary || "") + '</p>'
      + nextHTML
      + acts
      + '</div>';
  }
  function groupHTML(status, items){
    if(!items.length) return "";
    var s = STATUS[status];
    var inner;
    if(status === "done"){
      var buckets = [];
      items.forEach(function(it){
        var k = it.done_at || "";
        var last = buckets[buckets.length-1];
        if(last && last.k === k) last.items.push(it);
        else buckets.push({k:k, items:[it]});
      });
      inner = buckets.map(function(b){
        return '<div class="date-hd">' + esc(b.k ? fmtFull(b.k) : "날짜 미상") + '<span class="dc">' + b.items.length + '건</span></div>'
          + b.items.map(cardHTML).join("");
      }).join("");
    }else{
      inner = items.map(cardHTML).join("");
    }
    return '<section class="group ' + status + '">'
      + '<div class="g-hd"><span class="gi">' + s.icon + '</span><h2>' + esc(s.label) + '</h2>'
      +   '<span class="gc">' + items.length + '</span>'
      +   '<span class="gh-hint">' + esc(s.hint) + '</span></div>'
      + '<div class="cards">' + inner + '</div>'
      + '</section>';
  }
  function renderList(){
    var items = visibleItems();
    var html = "";
    if(state.status === "all"){
      ORDER.forEach(function(k){
        html += groupHTML(k, sortGroup(items.filter(function(it){ return it.status === k; }), k));
      });
    }else{
      html = groupHTML(state.status, sortGroup(items, state.status));
    }
    if(!html){
      html = '<div class="empty"><b>해당하는 항목이 없습니다</b>'
        + '검색어나 필터를 바꿔 보세요.'
        + (state.q || state.cat !== "all" || state.status !== "all" ? ' <button type="button" id="reset-filters" style="color:var(--accent);font-weight:700;text-decoration:underline">필터 초기화</button>' : '')
        + '</div>';
    }
    listEl.innerHTML = html;
    state.view = items;
  }
  function renderAll(){
    renderStats(); renderSeg(); renderChips(); renderList(); renderCheckbar();
  }
  function setStatus(k){
    state.status = k;
    renderStats(); renderSeg(); renderList();
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function setCat(k){
    state.cat = k;
    renderChips(); renderList();
  }

  /* ---------- 사용자 체크 (완료 · 필요 없음) ---------- */
  var OV_KEY = "work_dashboard_overrides_v1";
  var OV = {v:1, items:{}};
  var lastAction = null;
  var toastTimer = null;

  function loadOV(){
    try{
      var raw = localStorage.getItem(OV_KEY);
      if(!raw) return;
      var p = JSON.parse(raw);
      if(p && p.items && typeof p.items === "object") OV = {v:1, items:p.items};
    }catch(e){}
  }
  function saveOV(){
    try{ localStorage.setItem(OV_KEY, JSON.stringify(OV)); }catch(e){}
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function isoNow(){
    var d = new Date(), off = -d.getTimezoneOffset(), a = Math.abs(off);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate())
      + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
      + (off >= 0 ? "+" : "-") + pad(Math.floor(a/60)) + ":" + pad(a%60);
  }
  function rawItem(id){
    for(var i=0;i<RAW.length;i++){ if(RAW[i].id === id) return RAW[i]; }
    return null;
  }
  function ovLabel(st){
    if(st === "done") return "완료";
    if(st === "dismissed") return "필요 없음";
    return st || "";
  }
  /* 새 tasks.json 이 오면(updated_at 갱신) 또는 서버 상태가 이미 바뀌었으면 내 체크는 자동 정리 */
  function pruneOV(){
    var changed = false;
    var upd = (DATA.meta && DATA.meta.updated_at) ? new Date(DATA.meta.updated_at).getTime() : 0;
    Object.keys(OV.items).forEach(function(id){
      var o = OV.items[id] || {};
      var it = rawItem(id);
      var at = o.at ? new Date(o.at).getTime() : 0;
      var stale = !it
        || it.status === o.status
        || (o.base && it.status !== o.base)
        || (upd && at && at < upd);
      if(stale){ delete OV.items[id]; changed = true; }
    });
    if(changed) saveOV();
  }
  function materialize(){
    DATA.items = RAW.map(function(src){
      var it = {};
      for(var k in src) if(Object.prototype.hasOwnProperty.call(src,k)) it[k] = src[k];
      it._base = src.status;
      var o = OV.items[it.id];
      if(o && o.status && o.status !== src.status){
        it.status = o.status;
        it._override = o;
        if(o.status === "done") it.done_at = o.at ? String(o.at).slice(0,10) : todayStr();
      }
      return it;
    });
  }
  function applyOverride(id, act){
    var it = rawItem(id);
    if(!it) return;
    lastAction = {id:id, prev: OV.items[id] ? JSON.parse(JSON.stringify(OV.items[id])) : null};
    if(act === "undo"){
      delete OV.items[id];
    }else{
      OV.items[id] = {status: act === "done" ? "done" : "dismissed", at: isoNow(), base: it.status};
    }
    saveOV(); materialize(); renderAll();
    if(act === "undo"){
      showToast("원래 상태로 되돌렸습니다", null);
    }else{
      showToast(act === "done" ? "완료로 옮겼습니다" : "필요 없음으로 정리했습니다", undoLast);
    }
  }
  function undoLast(){
    if(!lastAction) return;
    if(lastAction.prev) OV.items[lastAction.id] = lastAction.prev;
    else delete OV.items[lastAction.id];
    saveOV(); materialize(); renderAll();
    showToast("되돌렸습니다", null);
  }
  function renderCheckbar(){
    var bar = $("checkbar");
    var ids = Object.keys(OV.items).filter(function(id){ return !!rawItem(id); });
    if(!ids.length){ bar.hidden = true; $("cb-list").innerHTML = ""; $("cb-n").textContent = "0"; return; }
    bar.hidden = false;
    $("cb-n").textContent = ids.length;
    $("cb-list").innerHTML = ids.map(function(id){
      return '<span class="cb-i">' + esc(rawItem(id).title) + ' <b>' + esc(ovLabel(OV.items[id].status)) + '</b></span>';
    }).join('<span class="cb-sep">·</span>');
  }
  function checkText(){
    return Object.keys(OV.items).filter(function(id){ return !!rawItem(id); }).map(function(id){
      return "[대시보드 체크] - " + rawItem(id).title + ": " + ovLabel(OV.items[id].status) + " (" + id + ")";
    }).join("\n");
  }
  function copyText(txt, btn, doneLabel){
    var ok = function(){
      if(!btn) return;
      var old = btn.textContent;
      btn.textContent = doneLabel || "복사됨 ✓";
      btn.classList.add("done");
      setTimeout(function(){ btn.textContent = old; btn.classList.remove("done"); }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){});
    }else{
      var ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); ok(); }catch(e){}
      document.body.removeChild(ta);
    }
  }
  function showToast(msg, undoFn){
    var t = $("toast");
    $("toast-msg").textContent = msg;
    $("toast-undo").style.display = undoFn ? "" : "none";
    t._undo = undoFn || null;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("on"); }, undoFn ? 5200 : 3200);
  }
  $("toast-undo").addEventListener("click", function(){
    var t = $("toast");
    t.classList.remove("on");
    clearTimeout(toastTimer);
    if(t._undo) t._undo();
  });
  $("cb-copy").addEventListener("click", function(){
    var txt = checkText();
    if(!txt) return;
    copyText(txt, this, "복사됨 ✓");
  });
  $("sh-acts").addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]");
    if(!b) return;
    var id = b.dataset.id, act = b.dataset.act;
    closeSheet();
    applyOverride(id, act);
  });
  loadOV();

  /* ---------- events ---------- */
  segEl.addEventListener("click", function(e){
    var b = e.target.closest("button[data-status]");
    if(b) setStatus(b.dataset.status);
  });
  chipsEl.addEventListener("click", function(e){
    var b = e.target.closest("button[data-cat]");
    if(b) setCat(b.dataset.cat);
  });
  document.querySelectorAll(".stat").forEach(function(b){
    b.addEventListener("click", function(){
      setStatus(state.status === b.dataset.status ? "all" : b.dataset.status);
    });
  });
  qEl.addEventListener("input", function(){
    state.q = qEl.value;
    searchWrap.classList.toggle("has-value", !!qEl.value);
    renderList();
  });
  $("q-clear").addEventListener("click", function(){
    qEl.value = ""; state.q = "";
    searchWrap.classList.remove("has-value");
    qEl.focus(); renderList();
  });
  listEl.addEventListener("click", function(e){
    if(e.target.id === "reset-filters"){
      state = Object.assign({}, state, {status:"all", cat:"all", q:""});
      qEl.value = ""; searchWrap.classList.remove("has-value");
      renderAll(); return;
    }
    var qa = e.target.closest("button[data-act]");
    if(qa){ e.stopPropagation(); applyOverride(qa.dataset.id, qa.dataset.act); return; }
    var card = e.target.closest(".card");
    if(card) openSheet(card.dataset.id);
  });
  listEl.addEventListener("keydown", function(e){
    if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
    var card = e.target.closest(".card");
    if(!card || e.target.closest("button")) return;
    e.preventDefault();
    openSheet(card.dataset.id);
  });

  /* ---------- sheet ---------- */
  var lastFocus = null;
  function openSheet(id){
    var it = DATA.items.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    state.openId = id;
    lastFocus = document.activeElement;

    $("sh-cat").textContent = CAT_LABEL[it.category] || "분류";
    var pill = $("sh-status");
    pill.textContent = STATUS[it.status].pill;
    pill.className = "status-pill " + it.status;
    $("sh-title").textContent = it.title;
    var dueTxt;
    if(it.status === "done"){
      dueTxt = it.done_at ? fmtFull(it.done_at) + " 완료" : (it._override ? "오늘 완료로 표시" : "—");
    }else if(it.status === "dismissed"){
      dueTxt = it.due ? fmtFull(it.due) + " · 표시 안 함" : "표시 안 함";
    }else if(!it.due){
      dueTxt = "기한 없음";
    }else{
      var dn = dayDiff(it.due);
      var tail = dn === 0 ? "오늘 마감" : dn === 1 ? "내일 마감" : (dn > 0 ? "D-" + dn : Math.abs(dn) + "일 지남");
      dueTxt = fmtFull(it.due) + " · " + tail;
    }
    $("sh-due").textContent = dueTxt;
    $("sh-area").textContent = it.area || "—";
    $("sh-memo").textContent = it.memo || it.summary || "메모 없음";

    var nw = $("sh-next-wrap");
    if(it.status === "dismissed"){
      nw.innerHTML = '<div class="sh-done-next">필요 없음으로 표시한 항목입니다. 아래 되돌리기로 원래 상태로 돌릴 수 있습니다.</div>';
    }else if(it.next){
      nw.innerHTML = '<div class="sh-next"><p>' + esc(it.next) + '</p><button class="cp" type="button" id="copy-next">복사</button></div>';
      var cp = $("copy-next");
      cp.addEventListener("click", function(){
        var txt = it.next;
        var okText = function(){ cp.textContent = "복사됨"; setTimeout(function(){ cp.textContent = "복사"; }, 1400); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(okText, function(){});
        }else{
          var ta = document.createElement("textarea");
          ta.value = txt; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); okText(); }catch(e){}
          document.body.removeChild(ta);
        }
      });
    }else{
      nw.innerHTML = '<div class="sh-done-next">완료된 항목입니다. 할 일이 남아 있지 않습니다.</div>';
    }

    renderSheetActs(it);

    var idx = state.view.findIndex(function(x){ return x.id === id; });
    $("sh-prev").disabled = idx <= 0;
    $("sh-next").disabled = idx < 0 || idx >= state.view.length - 1;
    $("sh-prev").dataset.id = idx > 0 ? state.view[idx-1].id : "";
    $("sh-next").dataset.id = (idx >= 0 && idx < state.view.length-1) ? state.view[idx+1].id : "";

    sheet.classList.add("on"); scrim.classList.add("on");
    sheet.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    sheet.scrollTop = 0;
    $("sh-close").focus();
  }
  function renderSheetActs(it){
    var el = $("sh-acts"), h = "";
    if(it.status === "action" || it.status === "progress"){
      h = '<button class="qa ok" type="button" data-act="done" data-id="' + esc(it.id) + '">✅ 완료</button>'
        + '<button class="qa no" type="button" data-act="dismiss" data-id="' + esc(it.id) + '">🚫 필요 없음</button>';
    }else if(it._override){
      h = '<button class="qa undo" type="button" data-act="undo" data-id="' + esc(it.id) + '">↩️ 되돌리기</button>'
        + '<span class="sh-act-note">내가 직접 체크한 항목 · 원래 상태 ' + esc(STATUS[it._base] ? STATUS[it._base].label : it._base) + '</span>';
    }else{
      h = '<span class="sh-act-note">서버에서 이미 완료된 항목입니다.</span>';
    }
    el.innerHTML = h;
  }
  function closeSheet(){
    sheet.classList.remove("on"); scrim.classList.remove("on");
    sheet.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
    state.openId = null;
    if(lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("sh-close").addEventListener("click", closeSheet);
  scrim.addEventListener("click", closeSheet);
  $("sh-prev").addEventListener("click", function(){
    if(this.dataset.id) openSheet(this.dataset.id);
  });
  $("sh-next").addEventListener("click", function(){
    if(this.dataset.id) openSheet(this.dataset.id);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ if(state.openId) closeSheet(); return; }
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA"){
      e.preventDefault(); qEl.focus();
    }
    if(!state.openId) return;
    if(e.key === "ArrowLeft" && !$("sh-prev").disabled){ $("sh-prev").click(); }
    if(e.key === "ArrowRight" && !$("sh-next").disabled){ $("sh-next").click(); }
    if(e.key === "Tab"){
      var f = sheet.querySelectorAll("button:not(:disabled), [href], input, textarea");
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- refresh ---------- */
  $("refresh-btn").addEventListener("click", function(){ load(true); });
  setInterval(function(){
    if(document.visibilityState === "visible") load(false);
  }, 300000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && DATA.meta && DATA.meta.updated_at){
      $("upd-age").textContent = ageText(DATA.meta.updated_at);
    }
  });

  /* ---------- boot ---------- */
  applyData(readFallback(), true);   // instant paint from embedded data
  load(false);                        // then live fetch
})();
</script>
</body>
</html>
