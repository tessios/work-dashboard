<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<title>업무 대시보드</title>
<style>
  :root{
    --bg:#FFFFFF; --bg-soft:#F4F5F7; --bg-soft-2:#FAFBFC;
    --card:#FFFFFF; --card-2:#FAFBFC;
    --ink:#101318; --ink-2:#363B43; --sub:#787F8A;
    --line:#E7E9EC; --line-soft:#F0F2F4; --line-hover:#D6DAE0;
    --action:#C2353F; --action-soft:#FBEDEE;
    --progress:#94620E; --progress-soft:#FBF3E5;
    --done:#0E7462; --done-soft:#E9F4F1;
    --shadow-sm:0 1px 2px rgba(16,20,28,.05);
    --shadow-md:0 8px 24px rgba(16,20,28,.09);
    --shadow-lg:0 20px 56px rgba(12,16,24,.18);
    --r:16px; --r-md:14px; --r-sm:10px;
  }
  html[data-theme="dark"]{
    --bg:#0B0C0E; --bg-soft:#191B1F; --bg-soft-2:#141619;
    --card:#101215; --card-2:#141619;
    --ink:#EDEFF3; --ink-2:#C4C9D0; --sub:#8B9199;
    --line:#24272C; --line-soft:#1B1E22; --line-hover:#34383F;
    --action:#EF7A82; --action-soft:#2A1618;
    --progress:#E0AC5E; --progress-soft:#241D12;
    --done:#4FCFB6; --done-soft:#0F2621;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 8px 26px rgba(0,0,0,.45);
    --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; letter-spacing:-.012em;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit;padding:0}
  input{font-family:inherit;color:inherit}
  h1,h2,h3,h4,p{margin:0}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 64px}

  /* ---------- header ---------- */
  .hd{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
  .hd-top{display:flex;align-items:center;gap:11px}
  .mark{
    width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--ink);color:var(--bg);
  }
  .mark svg{width:18px;height:18px}
  .hd-t h1{font-size:19px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
  .hd-t p{font-size:12px;color:var(--sub);margin-top:2px;font-weight:500}
  .hd-btns{margin-left:auto;display:flex;gap:6px}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
    background:var(--card);border:1px solid var(--line);color:var(--ink-2);transition:.16s;
  }
  .icon-btn:hover{background:var(--bg-soft)}
  .icon-btn:active{transform:scale(.95)}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn.spin svg{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hd-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);font-weight:500}
  .live{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--bg-soft);color:var(--ink-2);font-weight:600}
  .live .dot{width:5px;height:5px;border-radius:50%;background:var(--done)}
  .live.offline .dot{background:var(--progress)}
  .hd-meta b{color:var(--ink-2);font-weight:700}
  .meta-line{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
  .meta-line .sep{color:var(--line-hover)}

  /* ---------- stats ---------- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:20px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  }
  .stat{position:relative;text-align:left;padding:13px 13px 12px;transition:background .16s}
  .stat + .stat{border-left:1px solid var(--line)}
  .stat:hover{background:var(--bg-soft-2)}
  .stat[aria-pressed="true"]{background:var(--bg-soft)}
  .stat[aria-pressed="true"]::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:2px;
  }
  .stat .s-l{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--sub);letter-spacing:0}
  .stat .s-l i{width:5px;height:5px;border-radius:50%;background:var(--tone);display:inline-block;flex:none}
  .stat .s-n{font-size:27px;font-weight:800;letter-spacing:-.05em;line-height:1.15;margin-top:4px;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat .s-n span{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px;letter-spacing:0}
  .stat .s-s{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.4;display:none}
  .stat.action{--tone:var(--action)}
  .stat.progress{--tone:var(--progress)}
  .stat.done{--tone:var(--done)}

  /* ---------- controls ---------- */
  .controls{margin-bottom:6px}
  .search{position:relative;margin-bottom:4px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--sub)}
  .search input{
    width:100%;height:44px;border-radius:var(--r-md);border:1px solid transparent;background:var(--bg-soft);
    padding:0 40px 0 36px;font-size:14px;outline:none;transition:background .16s, box-shadow .16s;
  }
  .search input::placeholder{color:var(--sub)}
  .search input:focus{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
  .search .clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;display:none;place-items:center;color:var(--sub);font-size:13px}
  .search.has-value .clear{display:grid}

  .tabs{display:flex;gap:19px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:6px 0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    position:relative;flex:none;display:inline-flex;align-items:baseline;gap:5px;
    padding:9px 0 10px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;transition:color .16s;
  }
  .tabs button .n{font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
  .tabs button:hover{color:var(--ink-2)}
  .tabs button[aria-pressed="true"]{color:var(--ink);font-weight:800}
  .tabs button[aria-pressed="true"] .n{color:var(--ink-2)}
  .tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}

  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--bg-soft);color:var(--ink-2);transition:background .16s, color .16s;
  }
  .chip:hover{background:var(--line-soft)}
  html[data-theme="dark"] .chip:hover{background:var(--line)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .chip .cn{opacity:.55;margin-left:3px;font-weight:700;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"] .cn{opacity:.7}

  .list-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
  .list-meta .cnt{font-size:12px;color:var(--sub);font-weight:600}
  .list-meta .cnt b{color:var(--ink-2);font-weight:800;font-variant-numeric:tabular-nums}
  .sortwrap{position:relative;flex:none}
  .sort-btn{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-2);padding:5px 7px;border-radius:8px;transition:background .16s}
  .sort-btn:hover{background:var(--bg-soft)}
  .sort-btn svg{width:11px;height:11px;opacity:.7}
  .sort-menu{
    position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:142px;padding:5px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);
    display:none;
  }
  .sort-menu.on{display:block}
  .sort-menu button{display:flex;width:100%;align-items:center;gap:6px;padding:9px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:left}
  .sort-menu button:hover{background:var(--bg-soft)}
  .sort-menu button[aria-checked="true"]{background:var(--bg-soft);color:var(--ink);font-weight:800}
  .sort-menu .tick{margin-left:auto;font-weight:900;opacity:0}
  .sort-menu button[aria-checked="true"] .tick{opacity:1}

  /* ---------- list ---------- */
  main{display:flex;flex-direction:column;gap:26px;margin-top:14px}
  .group{display:flex;flex-direction:column}
  .g-hd{display:flex;align-items:center;gap:7px;padding:0 2px;margin-bottom:9px}
  .g-hd .g-dot{width:6px;height:6px;border-radius:50%;background:var(--sub);flex:none}
  .group.action .g-dot{background:var(--action)}
  .group.progress .g-dot{background:var(--progress)}
  .group.done .g-dot{background:var(--done)}
  .g-hd h2{font-size:13px;font-weight:800;letter-spacing:-.015em}
  .g-hd .gc{font-size:11.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
  .g-hd .gh-hint{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:500}
  .cards{display:flex;flex-direction:column;gap:8px}
  .date-hd{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--sub);margin:6px 2px 0}
  .date-hd:first-child{margin-top:0}
  .date-hd::after{content:"";flex:1;height:1px;background:var(--line)}
  .date-hd .dc{font-size:10.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}

  .card{
    position:relative;width:100%;text-align:left;padding:13px 14px 12px;border-radius:var(--r-md);
    background:var(--card);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:6px;cursor:pointer;
    transition:border-color .16s, box-shadow .16s, background .16s;
  }
  .card:hover{border-color:var(--line-hover);box-shadow:var(--shadow-sm)}
  .card:active{background:var(--card-2)}
  .card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .card .c-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--bg-soft);color:var(--ink-2);letter-spacing:0}
  .badge.mine{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
  .due{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;letter-spacing:0}
  .due.urgent{color:var(--action)}
  .due.soon{color:var(--progress)}
  .due.done{color:var(--sub)}
  .card h3{font-size:14.5px;font-weight:700;letter-spacing:-.025em;line-height:1.4;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-sum{font-size:12.5px;color:var(--sub);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-next{display:flex;align-items:flex-start;gap:5px;font-size:12px;color:var(--ink-2);font-weight:600;line-height:1.45;margin-top:1px}
  .card .c-next .arw{color:var(--sub);font-weight:700;flex:none}
  .card .c-next .t{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-acts{display:flex;gap:6px;padding-top:9px;margin-top:2px;border-top:1px solid var(--line-soft)}
  .group.done .card{background:var(--card-2)}
  .group.done .card h3{color:var(--ink-2);font-weight:600}
  .group.done .card .c-next{display:none}
  .group.dismissed .card{background:var(--bg-soft-2);border-color:var(--line-soft)}
  .group.dismissed .g-hd h2{color:var(--ink-2)}
  .group.dismissed .g-dot{background:var(--line-hover)}
  .group.dismissed .card h3{color:var(--sub);font-weight:600;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:var(--line-hover)}
  .group.dismissed .card .c-sum{opacity:.75}
  .group.dismissed .card .c-next{display:none}

  .qa{
    flex:1;height:33px;padding:0 8px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:-.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;
    background:var(--bg-soft);color:var(--ink-2);transition:filter .15s, background .15s;
  }
  .qa:hover{filter:brightness(.965)}
  html[data-theme="dark"] .qa:hover{filter:brightness(1.25)}
  .qa:active{transform:scale(.985)}
  .qa.ok{background:var(--done-soft);color:var(--done)}
  .qa.no{color:var(--sub)}
  .qa.undo{color:var(--ink-2)}

  /* ---------- check bar ---------- */
  .checkbar{
    display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:10px 11px;
    border-radius:var(--r-md);background:var(--bg-soft);
  }
  .checkbar[hidden]{display:none}
  .cb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .cb-t{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ink)}
  .cb-n{font-size:10.5px;font-weight:800;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
  .cb-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .cb-list::-webkit-scrollbar{display:none}
  .cb-i b{color:var(--ink);font-weight:800}
  .cb-sep{color:var(--sub);opacity:.5}
  .cb-copy{height:32px;padding:0 12px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;flex:none;transition:opacity .15s}
  .cb-copy:hover{opacity:.88}
  .cb-copy.done{background:var(--done);color:#fff}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    z-index:90;display:flex;align-items:center;gap:4px;max-width:calc(100% - 28px);
    background:var(--ink);color:var(--bg);border-radius:12px;padding:9px 9px 9px 15px;
    box-shadow:var(--shadow-lg);font-size:12.5px;font-weight:700;letter-spacing:-.01em;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{font-size:12.5px;font-weight:800;color:var(--bg);opacity:.75;padding:6px 10px;border-radius:8px;background:rgba(127,127,127,.22);flex:none}
  .toast button:hover{opacity:1}

  .empty{padding:52px 18px;text-align:center;color:var(--sub);font-size:13px}
  .empty b{display:block;font-size:14.5px;color:var(--ink-2);margin-bottom:6px;font-weight:700}
  .empty button{color:var(--ink);font-weight:700;text-decoration:underline;font-size:13px}

  footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:11.5px;color:var(--sub);line-height:1.6}
  footer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--bg-soft);padding:1px 5px;border-radius:5px}

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(10,13,20,.38);opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:61;
    display:flex;flex-direction:column;max-height:90vh;
    background:var(--card);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
    transform:translateY(102%);visibility:hidden;pointer-events:none;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .22s, visibility .28s;
  }
  .sheet.on{transform:translateY(0);visibility:visible;pointer-events:auto}
  .sh-head{flex:none;padding:8px 18px 10px;touch-action:pan-y}
  .sh-grip{width:36px;height:4px;border-radius:99px;background:var(--line-hover);margin:2px auto 12px}
  .sh-top{display:flex;align-items:center;gap:6px;margin-bottom:9px}
  .status-pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:0}
  .status-pill.action{background:var(--action-soft);color:var(--action)}
  .status-pill.progress{background:var(--progress-soft);color:var(--progress)}
  .status-pill.done{background:var(--done-soft);color:var(--done)}
  .status-pill.dismissed{background:var(--bg-soft);color:var(--sub)}
  .sh-count{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
  .sh-x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--sub);background:var(--bg-soft);font-size:13px;flex:none}
  .sh-x:hover{background:var(--line-soft)}
  #sh-title{font-size:18px;font-weight:800;letter-spacing:-.035em;line-height:1.35;word-break:keep-all}
  .sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px 18px;
    border-top:1px solid var(--line-soft);margin-top:2px}
  .sh-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .sh-fact{background:var(--bg-soft);border-radius:10px;padding:9px 11px}
  .sh-fact .k{font-size:10.5px;font-weight:700;color:var(--sub);margin-bottom:2px;letter-spacing:0}
  .sh-fact .v{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .sh-sec{margin-bottom:16px}
  .sh-sec:last-child{margin-bottom:4px}
  .sh-sec h4{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px;letter-spacing:.01em}
  .sh-sec p{font-size:13.5px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;word-break:keep-all}
  .sh-next{background:var(--bg-soft);border-radius:12px;padding:12px 13px;display:flex;align-items:flex-start;gap:10px}
  .sh-next p{font-size:13.5px;font-weight:700;color:var(--ink);flex:1;line-height:1.5}
  .sh-next .cp{font-size:11.5px;font-weight:800;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 9px;flex:none;transition:.15s}
  .sh-next .cp:hover{border-color:var(--line-hover)}
  .sh-done-next{font-size:13px;color:var(--sub);background:var(--bg-soft);border-radius:12px;padding:12px 13px;line-height:1.6}
  .sh-foot{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--card);
  }
  .sh-nav{display:flex;gap:6px;flex:none}
  .sh-nav button{
    width:42px;height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--ink-2);transition:.15s;
  }
  .sh-nav button svg{width:16px;height:16px}
  .sh-nav button:disabled{opacity:.34;cursor:default}
  .sh-nav button:not(:disabled):hover{background:var(--bg-soft)}
  .sh-acts{display:flex;gap:8px;flex:1;min-width:0;align-items:center}
  .sh-acts .qa{height:44px;font-size:13px;border-radius:11px}
  .sh-acts .qa.ok{background:var(--ink);color:var(--bg);flex:1}
  .sh-acts .qa.ok:hover{filter:none;opacity:.9}
  .sh-acts .qa.no{background:var(--bg-soft)}
  .sh-acts .qa.undo{background:var(--ink);color:var(--bg);flex:1}
  .sh-act-note{font-size:12px;color:var(--sub);font-weight:600;line-height:1.5}

  @media (min-width:640px){
    .wrap{padding:34px 28px 84px}
    .hd-top{gap:13px}
    .mark{width:38px;height:38px;border-radius:12px}
    .hd-t h1{font-size:22px}
    .hd-t p{font-size:12.5px}
    .icon-btn{width:36px;height:36px}
    .stats{margin-bottom:22px}
    .stat{padding:16px 18px 15px}
    .stat .s-n{font-size:32px}
    .stat .s-s{display:block}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .date-hd{grid-column:1/-1;margin-top:8px}
    .card{padding:14px 16px 13px}
    .card h3{font-size:15px}
    .sheet{
      left:50%;right:auto;bottom:auto;top:50%;width:min(600px,calc(100% - 40px));

<script>
(function(){
  "use strict";

  var STATUS = {
    action:  {label:"액션 필요", pill:"액션 필요", hint:"직접 결정·발행·전달이 필요한 일"},
    progress:{label:"하는 중",   pill:"하는 중",   hint:"응답·승인·예약일을 기다리는 일"},
    done:    {label:"완료",      pill:"완료",      hint:"최근 완료한 주요 성과"},
    dismissed:{label:"필요 없음", pill:"필요 없음", hint:"내가 필요 없다고 표시한 일 · 되돌리기 가능"}
  };
  var ORDER = ["action","progress","done","dismissed"];
  var CATS = [
    {key:"all",     label:"전체"},
    {key:"content", label:"블로그·콘텐츠"},
    {key:"work",    label:"업무·자격증"},
    {key:"review",  label:"체험단·리뷰"},
    {key:"life",    label:"생활·금융"}
  ];
  var SORTS = [
    {key:"due",      label:"마감 임박순"},
    {key:"priority", label:"우선순위순"},
    {key:"title",    label:"이름순"}
  ];
  var CAT_LABEL = CATS.reduce(function(m,c){ m[c.key]=c.label; return m; }, {});

  var state = {status:"all", cat:"all", q:"", sort:"due", openId:null, view:[]};
  var DATA = {meta:{}, items:[]};
  var RAW = [];

  var $ = function(id){ return document.getElementById(id); };
  var listEl = $("list"), segEl = $("seg"), chipsEl = $("chips"),
      qEl = $("q"), searchWrap = $("search-wrap"),
      sheet = $("sheet"), scrim = $("scrim");

  /* ---------- utils ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function parseDay(s){
    if(!s) return null;
    var p = String(s).slice(0,10).split("-");
    return new Date(+p[0], (+p[1])-1, +p[2]);
  }
  function startOfToday(){
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function dayDiff(dueStr){
    var d = parseDay(dueStr);
    if(!d) return null;
    return Math.round((d - startOfToday())/86400000);
  }
  function fmtMD(s){
    var d = parseDay(s);
    if(!d) return "";
    return (d.getMonth()+1) + "/" + pad(d.getDate());
  }
  function fmtFull(s){
    var d = parseDay(s);
    if(!d) return "—";
    var w = ["일","월","화","수","목","금","토"][d.getDay()];
    return (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + w + ")";
  }
  function dueInfo(item){
    if(item.status === "done"){
      if(!item.done_at) return null;
      return {text: fmtMD(item.done_at) + " 완료", cls:"done"};
    }
    var n = dayDiff(item.due);
    if(n === null) return null;
    if(n < 0)  return {text: Math.abs(n) + "일 지남", cls:"urgent"};
    if(n === 0) return {text:"오늘 마감", cls:"urgent"};
    if(n === 1) return {text:"내일 마감", cls:"urgent"};
    if(n <= 10) return {text:"D-" + n, cls:"soon"};
    return {text: fmtMD(item.due), cls:""};
  }
  function dueSort(item){
    var n = dayDiff(item.due);
    return n === null ? 9999 : n;
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function norm(s){ return String(s||"").toLowerCase().replace(/\s+/g," ").trim(); }

  /* ---------- theme ---------- */
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try{ localStorage.setItem("wd-theme", t); }catch(e){}
    var m = document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t === "dark" ? "#0B0C0E" : "#FFFFFF");
  }
  (function initTheme(){
    var t = "light";
    try{
      var saved = localStorage.getItem("wd-theme");
      if(saved) t = saved;
      else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    }catch(e){}
    applyTheme(t);
  })();
  $("theme-btn").addEventListener("click", function(){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ---------- today label ---------- */
  (function(){
    var d = new Date(), w = ["일","월","화","수","목","금","토"][d.getDay()];
    $("date-label").textContent = d.getFullYear() + "년 " + (d.getMonth()+1) + "월 " + d.getDate() + "일 (" + w + ")";
  })();

  /* ---------- data load ---------- */
  function setLive(kind, text){
    var pill = $("live-pill");
    pill.classList.toggle("offline", kind === "offline");
    $("live-text").textContent = text;
  }
  function ageText(iso){
    if(!iso) return "업데이트 시각 없음";
    var t = new Date(iso).getTime();
    if(isNaN(t)) return "업데이트 시각 확인 불가";
    var diff = Math.max(0, Date.now() - t);
    var m = Math.floor(diff/60000);
    if(m < 1) return "방금";
    if(m < 60) return m + "분 전";
    var h = Math.floor(m/60);
    if(h < 24) return h + "시간 전";
    var d = Math.floor(h/24);
    if(d < 8) return d + "일 전";
    return "오래된 데이터";
  }
  function readFallback(){
    try{ return JSON.parse($("fallback-data").textContent); }catch(e){ return {meta:{}, items:[]}; }
  }
  function applyData(obj, offline){
    DATA = obj && obj.items ? obj : {meta:{}, items:[]};
    RAW = DATA.items.map(function(it, i){
      return Object.assign({id:"item-" + i}, it);
    });
    pruneOV();
    materialize();
    var meta = DATA.meta || {};
    $("upd-label").textContent = meta.updated_label || fmtMD(meta.updated_at) || "—";
    $("upd-age").textContent = ageText(meta.updated_at);
    $("ver-label").textContent = meta.version ? ("v" + meta.version) : "";
    setLive(offline ? "offline" : "on", offline ? "오프라인 데이터" : "최신 데이터 연결됨");
    renderAll();
  }
  function load(manual){
    var btn = $("refresh-btn");
    if(manual) btn.classList.add("spin");
    var done = function(){
      if(manual) setTimeout(function(){ btn.classList.remove("spin"); }, 450);
    };
    fetch("./tasks.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ applyData(j, false); done(); })
      .catch(function(){
        if(!DATA.items.length){
          applyData(readFallback(), true);
        }else{
          setLive("offline", "연결 실패 · 마지막 데이터");
          $("upd-age").textContent = "새로고침 실패";
        }
        done();
      });
  }

  /* ---------- filters ---------- */
  function counts(){
    var c = {action:0, progress:0, done:0, dismissed:0};
    DATA.items.forEach(function(it){ if(c[it.status] !== undefined) c[it.status]++; });
    return c;
  }
  function visibleItems(){
    var q = norm(state.q);
    return DATA.items.filter(function(it){
      if(state.status !== "all" && it.status !== state.status) return false;
      if(state.cat !== "all" && it.category !== state.cat) return false;
      if(q){
        var hay = norm([it.title, it.summary, it.memo, it.next, it.area, it.category].join(" "));
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }
  function sortGroup(items, status){
    return items.slice().sort(function(a,b){
      if(state.sort === "title"){
        return String(a.title||"").localeCompare(String(b.title||""), "ko");
      }
      if(status === "done" || status === "dismissed"){
        var ka = String((status === "done" ? a.done_at : (a._override && a._override.at)) || "");
        var kb = String((status === "done" ? b.done_at : (b._override && b._override.at)) || "");
        return kb.localeCompare(ka);
      }
      if(state.sort === "priority"){
        var pa = a.priority || 9, pb = b.priority || 9;
        if(pa !== pb) return pa - pb;
      }
      var da = dueSort(a), db = dueSort(b);
      if(da !== db) return da - db;
      return (a.priority || 9) - (b.priority || 9);
    });
  }

  function cardHTML(it){
    var di = (it.status === "done" || it.status === "dismissed") ? null : dueInfo(it);
    var dueHTML = di ? '<span class="due ' + di.cls + '">' + esc(di.text) + '</span>' : "";

      : "";

        + '<button class="qa no" type="button" data-act="dismiss" data-id="' + esc(it.id) + '">🚫 필요 없음</button>'
        + '</div>';

  function groupHTML(status, items){
    if(!items.length) return "";
    var s = STATUS[status];
    var inner;
    if(status === "done"){
      var buckets = [];
      items.forEach(function(it){
        var k = it.done_at || "";
        var last = buckets[buckets.length-1];
        if(last && last.k === k) last.items.push(it);
        else buckets.push({k:k, items:[it]});
      });
      inner = buckets.map(function(b){
        return '<div class="date-hd">' + esc(b.k ? fmtFull(b.k) : "날짜 미상") + '<span class="dc">' + b.items.length + '건</span></div>'
          + b.items.map(cardHTML).join("");
      }).join("");
    }else{
      inner = items.map(cardHTML).join("");
    }
    return '<section class="group ' + status + '">'
      + '<div class="g-hd"><span class="g-dot" aria-hidden="true"></span><h2>' + esc(s.label) + '</h2>'
      +   '<span class="gc">' + items.length + '</span>'
      +   '<span class="gh-hint">' + esc(s.hint) + '</span></div>'
      + '<div class="cards">' + inner + '</div>'
      + '</section>';
  }
  function renderList(){
    var items = visibleItems();
    var html = "";
    if(state.status === "all"){
      ORDER.forEach(function(k){
        html += groupHTML(k, sortGroup(items.filter(function(it){ return it.status === k; }), k));
      });
    }else{
      html = groupHTML(state.status, sortGroup(items, state.status));
    }
    if(!html){
      html = '<div class="empty"><b>해당하는 항목이 없습니다</b>'
        + '검색어나 필터를 바꿔 보세요.'

  /* ---------- 사용자 체크 (완료 · 필요 없음) ---------- */
  var OV_KEY = "work_dashboard_overrides_v1";
  var OV = {v:1, items:{}};
  var lastAction = null;
  var toastTimer = null;

  function loadOV(){
    try{
      var raw = localStorage.getItem(OV_KEY);
      if(!raw) return;
      var p = JSON.parse(raw);
      if(p && p.items && typeof p.items === "object") OV = {v:1, items:p.items};
    }catch(e){}
  }
  function saveOV(){
    try{ localStorage.setItem(OV_KEY, JSON.stringify(OV)); }catch(e){}
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function isoNow(){
    var d = new Date(), off = -d.getTimezoneOffset(), a = Math.abs(off);
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate())
      + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
      + (off >= 0 ? "+" : "-") + pad(Math.floor(a/60)) + ":" + pad(a%60);
  }
  function rawItem(id){
    for(var i=0;i<RAW.length;i++){ if(RAW[i].id === id) return RAW[i]; }
    return null;
  }
  function ovLabel(st){
    if(st === "done") return "완료";
    if(st === "dismissed") return "필요 없음";
    return st || "";
  }
  /* 새 tasks.json 이 오면(updated_at 갱신) 또는 서버 상태가 이미 바뀌었으면 내 체크는 자동 정리 */
  function pruneOV(){
    var changed = false;
    var upd = (DATA.meta && DATA.meta.updated_at) ? new Date(DATA.meta.updated_at).getTime() : 0;
    Object.keys(OV.items).forEach(function(id){
      var o = OV.items[id] || {};
      var it = rawItem(id);
      var at = o.at ? new Date(o.at).getTime() : 0;
      var stale = !it
        || it.status === o.status
        || (o.base && it.status !== o.base)
        || (upd && at && at < upd);
      if(stale){ delete OV.items[id]; changed = true; }
    });
    if(changed) saveOV();
  }
  function materialize(){
    DATA.items = RAW.map(function(src){
      var it = {};
      for(var k in src) if(Object.prototype.hasOwnProperty.call(src,k)) it[k] = src[k];
      it._base = src.status;
      var o = OV.items[it.id];
      if(o && o.status && o.status !== src.status){
        it.status = o.status;
        it._override = o;
        if(o.status === "done") it.done_at = o.at ? String(o.at).slice(0,10) : todayStr();
      }
      return it;
    });
  }
  function applyOverride(id, act){
    var it = rawItem(id);
    if(!it) return;
    lastAction = {id:id, prev: OV.items[id] ? JSON.parse(JSON.stringify(OV.items[id])) : null};
    if(act === "undo"){
      delete OV.items[id];
    }else{
      OV.items[id] = {status: act === "done" ? "done" : "dismissed", at: isoNow(), base: it.status};
    }
    saveOV(); materialize(); renderAll();
    if(act === "undo"){
      showToast("원래 상태로 되돌렸습니다", null);
    }else{
      showToast(act === "done" ? "완료로 옮겼습니다" : "필요 없음으로 정리했습니다", undoLast);
    }
  }
  function undoLast(){
    if(!lastAction) return;
    if(lastAction.prev) OV.items[lastAction.id] = lastAction.prev;
    else delete OV.items[lastAction.id];
    saveOV(); materialize(); renderAll();
    showToast("되돌렸습니다", null);
  }
  function renderCheckbar(){
    var bar = $("checkbar");
    var ids = Object.keys(OV.items).filter(function(id){ return !!rawItem(id); });
    if(!ids.length){ bar.hidden = true; $("cb-list").innerHTML = ""; $("cb-n").textContent = "0"; return; }
    bar.hidden = false;
    $("cb-n").textContent = ids.length;
    $("cb-list").innerHTML = ids.map(function(id){
      return '<span class="cb-i">' + esc(rawItem(id).title) + ' <b>' + esc(ovLabel(OV.items[id].status)) + '</b></span>';
    }).join('<span class="cb-sep">·</span>');
  }
  function checkText(){
    return Object.keys(OV.items).filter(function(id){ return !!rawItem(id); }).map(function(id){
      return "[대시보드 체크] - " + rawItem(id).title + ": " + ovLabel(OV.items[id].status) + " (" + id + ")";
    }).join("\n");
  }
  function copyText(txt, btn, doneLabel){
    var ok = function(){
      if(!btn) return;
      var old = btn.textContent;
      btn.textContent = doneLabel || "복사됨 ✓";
      btn.classList.add("done");
      setTimeout(function(){ btn.textContent = old; btn.classList.remove("done"); }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){});
    }else{
      var ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); ok(); }catch(e){}
      document.body.removeChild(ta);
    }
  }
  function showToast(msg, undoFn){
    var t = $("toast");
    $("toast-msg").textContent = msg;
    $("toast-undo").style.display = undoFn ? "" : "none";
    t._undo = undoFn || null;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("on"); }, undoFn ? 5200 : 3200);
  }
  $("toast-undo").addEventListener("click", function(){
    var t = $("toast");
    t.classList.remove("on");
    clearTimeout(toastTimer);
    if(t._undo) t._undo();
  });
  $("cb-copy").addEventListener("click", function(){
    var txt = checkText();
    if(!txt) return;
    copyText(txt, this, "복사됨 ✓");
  });
  $("sh-acts").addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]");
    if(!b) return;

  /* ---------- sheet ---------- */
  var lastFocus = null;
  function openSheet(id){
    var it = DATA.items.filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    state.openId = id;
    lastFocus = document.activeElement;

    $("sh-cat").textContent = it.area || CAT_LABEL[it.category] || "분류";
    var pill = $("sh-status");
    pill.textContent = STATUS[it.status].pill;
    pill.className = "status-pill " + it.status;
    $("sh-title").textContent = it.title;

    var idx = state.view.findIndex(function(x){ return x.id === id; });
    $("sh-counter").textContent = (idx >= 0 ? (idx+1) + " / " + state.view.length : "");

    var dueTxt;
    if(it.status === "done"){
      dueTxt = it.done_at ? fmtFull(it.done_at) + " 완료" : (it._override ? "오늘 완료로 표시" : "—");
    }else if(it.status === "dismissed"){
      dueTxt = it.due ? fmtFull(it.due) + " · 표시 안 함" : "표시 안 함";
    }else if(!it.due){
      dueTxt = "기한 없음";
    }else{
      var dn = dayDiff(it.due);
      var tail = dn === 0 ? "오늘 마감" : dn === 1 ? "내일 마감" : (dn > 0 ? "D-" + dn : Math.abs(dn) + "일 지남");
      dueTxt = fmtFull(it.due) + " · " + tail;
    }
    $("sh-due").textContent = dueTxt;
    $("sh-area").textContent = it.area || "—";
    $("sh-memo").textContent = it.memo || it.summary || "메모 없음";

    var nw = $("sh-next-wrap");
    if(it.status === "dismissed"){
      nw.innerHTML = '<div class="sh-done-next">필요 없음으로 표시한 항목입니다. 아래 되돌리기로 원래 상태로 돌릴 수 있습니다.</div>';
    }else if(it.next){
      nw.innerHTML = '<div class="sh-next"><p>' + esc(it.next) + '</p><button class="cp" type="button" id="copy-next">복사</button></div>';
      var cp = $("copy-next");
      cp.addEventListener("click", function(){
        var txt = it.next;
        var okText = function(){ cp.textContent = "복사됨"; setTimeout(function(){ cp.textContent = "복사"; }, 1400); };
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(okText, function(){});
        }else{
          var ta = document.createElement("textarea");
          ta.value = txt; document.body.appendChild(ta); ta.select();
          try{ document.execCommand("copy"); okText(); }catch(e){}
          document.body.removeChild(ta);
        }
      });
    }else{
      nw.innerHTML = '<div class="sh-done-next">완료된 항목입니다. 할 일이 남아 있지 않습니다.</div>';
    }

    renderSheetActs(it);

    $("sh-prev").disabled = idx <= 0;
    $("sh-next").disabled = idx < 0 || idx >= state.view.length - 1;
    $("sh-prev").dataset.id = idx > 0 ? state.view[idx-1].id : "";
    $("sh-next").dataset.id = (idx >= 0 && idx < state.view.length-1) ? state.view[idx+1].id : "";

    sheet.classList.add("on"); scrim.classList.add("on");
    sheet.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    $("sh-body").scrollTop = 0;
    $("sh-close").focus();
  }
  function renderSheetActs(it){
    var el = $("sh-acts"), h = "";
    if(it.status === "action" || it.status === "progress"){
      h = '<button class="qa ok" type="button" data-act="done" data-id="' + esc(it.id) + '">✅ 완료</button>'
        + '<button class="qa no" type="button" data-act="dismiss" data-id="' + esc(it.id) + '">🚫 필요 없음</button>';
    }else if(it._override){
      h = '<button class="qa undo" type="button" data-act="undo" data-id="' + esc(it.id) + '">↩️ 되돌리기</button>';
    }else{
      h = '<span class="sh-act-note">서버에서 이미 완료된 항목입니다.</span>';
    }
    el.innerHTML = h;

  function closeSheet(){

  /* ---------- sheet drag (모바일: 아래로 밀어 닫기) ---------- */
  (function(){
    var head = sheet.querySelector(".sh-head");
    var sy = 0, dy = 0, dragging = false;
    function isMobile(){ return window.innerWidth < 640; }
    head.addEventListener("touchstart", function(e){
      if(!isMobile() || !sheet.classList.contains("on")) return;
      dragging = true; sy = e.touches[0].clientY; dy = 0;
      sheet.style.transition = "none";
    }, {passive:true});
    head.addEventListener("touchmove", function(e){
      if(!dragging) return;
      dy = Math.max(0, e.touches[0].clientY - sy);
      sheet.style.transform = "translateY(" + dy + "px)";
    }, {passive:true});
    head.addEventListener("touchend", function(){
      if(!dragging) return;
      dragging = false;
      sheet.style.transition = "";
      if(dy > 110){
        sheet.style.transform = "translateY(100%)";
        setTimeout(function(){ sheet.style.transform = ""; closeSheet(); }, 200);
      }else{
        sheet.style.transform = "";
      }
      dy = 0;
    });
    head.addEventListener("touchcancel", function(){
      if(!dragging) return;
      dragging = false; sheet.style.transition = ""; sheet.style.transform = ""; dy = 0;
    });
  })();

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if($("sort-menu").classList.contains("on")){ closeSortMenu(); return; }
      if(state.openId) closeSheet();
      return;
    }
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if(e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA"){
      e.preventDefault(); qEl.focus();
    }
    if(!state.openId) return;
    if(e.key === "ArrowLeft" && !$("sh-prev").disabled){ $("sh-prev").click(); }
    if(e.key === "ArrowRight" && !$("sh-next").disabled){ $("sh-next").click(); }
    if(e.key === "Tab"){
      var f = sheet.querySelectorAll("button:not(:disabled), [href], input, textarea");
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- refresh ---------- */
  $("refresh-btn").addEventListener("click", function(){ load(true); });
  setInterval(function(){
    if(document.visibilityState === "visible") load(false);
  }, 300000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && DATA.meta && DATA.meta.updated_at){
      $("upd-age").textContent = ageText(DATA.meta.updated_at);
    }
  });

  /* ---------- boot ---------- */
  applyData(readFallback(), true);   // instant paint from embedded data
  load(false);                        // then live fetch
})();
</script>
</body>
</html>
